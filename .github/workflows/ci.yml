# CI tuned to use GitHub Actions minutes efficiently:
# - Draft PRs run quick checks only (style, static analysis, type checks).
# - Ready-for-review PRs run the full test suites once.
# - Unchanged areas are skipped; superseded runs are cancelled; nothing re-runs on main after merge.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      api: ${{ steps.filter.outputs.api }}
      js: ${{ steps.filter.outputs.js }}
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - '.github/workflows/**'
            js:
              - 'apps/web/**'
              - 'apps/mobile/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - '.github/workflows/**'
            native:
              - 'apps/mobile/modules/**'
              - 'apps/mobile/app.config.ts'
              - 'apps/mobile/package.json'

  api-quick:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis, intl, sodium, zip, gd
          coverage: none
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('apps/api/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Code style (Pint)
        run: vendor/bin/pint --test
      - name: Static analysis (Larastan level 8)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  api-tests:
    needs: [changes, api-quick]
    if: needs.changes.outputs.api == 'true' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis, intl, sodium, zip, gd
          coverage: none
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('apps/api/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Create a non-superuser app role so row-level security is enforced in tests
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -c "CREATE ROLE app LOGIN PASSWORD 'app' NOSUPERUSER CREATEDB;"
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE skills_test OWNER app;"
      - name: Tests (Pest)
        run: php artisan test

  js-quick:
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run lint
      - run: pnpm -r --if-present run typecheck

  js-tests:
    needs: [changes, js-quick]
    if: needs.changes.outputs.js == 'true' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run test
      - name: Build web and enforce the bundle budget (initial JS < 160 KB gzip)
        run: pnpm --filter @skills/web build && pnpm --filter @skills/web run size

  mobile:
    # Type-check, unit tests (outbox, device-signed refresh, app PIN) and a full
    # Metro bundle for Android, so a broken import never reaches an EAS build.
    needs: [changes, js-quick]
    if: needs.changes.outputs.js == 'true' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bundle the Android app (Hermes)
        working-directory: apps/mobile
        env:
          CI: '1'
          API_BASE_URL: https://api.staging.skillsecosystem.co.za/v1
        run: pnpm exec expo export --platform android --output-dir dist

  android-native:
    # Compiles our own Android code (WhatsApp one-tap and SMS Retriever autofill) inside
    # a generated Android project. Only when native code or the app config changes.
    needs: [changes, js-quick]
    if: needs.changes.outputs.native == 'true' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - name: Generate the Android project
        working-directory: apps/mobile
        env:
          CI: '1'
        run: pnpm exec expo prebuild --platform android --no-install
      - name: Compile the autofill module
        working-directory: apps/mobile/android
        run: ./gradlew :code-autofill:compileReleaseKotlin --no-daemon --stacktrace

  e2e:
    # Browser smoke test of the real web app against the real API (sign-in with MFA,
    # provider console, Super Admin console, phone layout). Uses the runner's Chrome.
    needs: changes
    if: (needs.changes.outputs.api == 'true' || needs.changes.outputs.js == 'true') && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis, intl, sodium, zip, gd
          coverage: none
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('apps/api/composer.lock') }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: composer install --no-interaction --prefer-dist --no-progress
        working-directory: apps/api
      - run: pnpm install --frozen-lockfile && pnpm --filter @skills/web build
      - name: Database (non-superuser app role)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -c "CREATE ROLE app LOGIN PASSWORD 'app' NOSUPERUSER CREATEDB;"
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE skills OWNER app;"
      - name: Start API and web
        working-directory: apps/api
        run: |
          cp .env.example .env && php artisan key:generate
          php artisan migrate --force && php artisan db:seed --class=DemoSeeder --force
          PHP_CLI_SERVER_WORKERS=4 nohup php artisan serve --host=127.0.0.1 --port=8000 > /tmp/api.log 2>&1 &
          nohup php artisan queue:work --tries=5 --sleep=1 > /tmp/queue.log 2>&1 &
          (cd ../web && nohup pnpm exec vite preview --host 127.0.0.1 --port 4173 > /tmp/web.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf -H 'Host: tym.platform.test' http://127.0.0.1:4173/v1/branding && break; sleep 1; done
      - run: pip install --quiet playwright==1.55.0
      - name: Browser smoke test
        env:
          SHOTS: ${{ runner.temp }}/shots
          CHROME: /usr/bin/google-chrome
        run: python3 apps/web/e2e/smoke.py
      - name: Accessibility audit (axe, WCAG 2.2 AA)
        env:
          CHROME: /usr/bin/google-chrome
        run: python3 apps/web/e2e/a11y.py
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: |
            ${{ runner.temp }}/shots
            /tmp/api.log
            /tmp/queue.log
            /tmp/web.log
          retention-days: 7
